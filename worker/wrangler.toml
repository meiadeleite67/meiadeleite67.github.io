name = "meiadeleite-quadro"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

# A conta do grupo, fixada para o wrangler nao perguntar qual usar a quem
# tiver acesso a mais do que uma.
account_id = "281d601cbcde851304121a32ea476202"

[[routes]]
pattern = "api.meiadeleite.pt"
custom_domain = true

# Folgado para vários jogadores no mesmo Wi-Fi; não faz leituras de KV.
[[ratelimits]]
name = "PEDIDOS_JOGOS"
namespace_id = "10671012"
simple = { limit = 240, period = 60 }

[[ratelimits]]
name = "PEDIDOS_SITE"
namespace_id = "10671013"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "ESCRITAS_SITE"
namespace_id = "10671014"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "VERIFICACOES"
namespace_id = "10671015"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ENTRADAS"
namespace_id = "10671016"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "LIGACOES_POKER"
namespace_id = "10671017"
simple = { limit = 10, period = 60 }

# O Worker atende no endereco workers.dev da conta.
#
# Se algum dia quiseres que ele atenda tambem no proprio dominio, em
# meiadeleite.pt/api, tira o comentario daqui de baixo e publica outra vez.
# Fica na mesma origem do site e deixa de precisar de CORS.
#
# [[routes]]
# pattern = "meiadeleite.pt/api/*"
# zone_name = "meiadeleite.pt"

# O KV onde as pontuacoes e a agenda ficam guardadas. O id vem do comando
#   npx wrangler kv namespace create QUADRO
[[kv_namespaces]]
binding = "QUADRO"
id = "9237e4fa77dd48ba94f2b8bd21754cec"

# As mesas de poker. Cada mesa e um objecto destes: um sitio so, que atende um
# pedido de cada vez, com o estado da mesa la dentro e as ligacoes de quem esta
# sentado agarradas a ele. E o que o armazenamento normal nao dava: ali duas
# jogadas ao mesmo tempo podiam gravar uma por cima da outra.
[[durable_objects.bindings]]
name = "MESAS"
class_name = "MesaDePoker"

# O banco: os torroes de toda a gente num sitio so. Uma carteira partilhada
# pelos tres jogos nao podia viver no KV, que e consistente so com o tempo:
# quem se sentasse em duas mesas ao mesmo tempo gastava os mesmos torroes
# duas vezes.
[[durable_objects.bindings]]
name = "BANCO"
class_name = "Banco"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MesaDePoker"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Banco"]

# O relogio das apostas desportivas, de duas em duas horas.
#
# Sao quatro voltas por dia e nao uma porque quase nenhuma custa alguma coisa:
# saber que jogos ha e quais ja acabaram e de graca na feed, e so se paga para
# saber as cotacoes de uma liga que tenha jornada nova e o resultado de um jogo
# que se saiba ja acabado. Numa semana calma isto gasta menos do que gastava a
# dar uma volta por dia, e as apostas fecham no proprio dia em vez de ficarem a
# espera da manha seguinte.
[triggers]
crons = ["0 */2 * * *"]
